name: merchendice

services:
  mail-api:
    build:
      context: ./mail-api
    image: merchendice-mail-api:latest
    container_name: merchendice-mail-api
    restart: unless-stopped
    environment:
      SMTP_USER: ${SMTP_USER}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}
      MAIL_TO: ${MAIL_TO:-merchendices@gmail.com}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://merchendice.com}
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  merchendice:
    build:
      context: .
    image: merchendice:latest
    container_name: merchendice
    restart: unless-stopped
    depends_on:
      mail-api:
        condition: service_healthy
    ports:
      - "82:8080"
