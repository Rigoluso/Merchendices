<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visit Merchendice and find us on TikTok, Instagram, and YouTube.">
  <meta name="theme-color" content="#2b2a28">
  <title>Merchendice Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f3eb;
      --surface: #fbf7f1;
      --ink: #2b2a28;
      --muted: #5e5c58;
      --line: #c9c0b3;
      --accent: #b03a26;
      --accent-hover: #8c2e20;
      --on-accent: #fff8f2;
      --serif: "Cormorant Garamond", Garamond, Georgia, serif;
      --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif;
      --gutter: clamp(1.25rem, 5vw, 3rem);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.65 var(--sans); }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .site-header { background: var(--ink); color: var(--paper); }
    .header-inner {
      display: flex;
      align-items: center;
      width: min(100% - var(--gutter) * 2, 75rem);
      min-height: 4.25rem;
      margin-inline: auto;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font: 600 1.55rem/1 var(--serif);
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      grid-template-areas: "intro links" "photos links";
      align-items: start;
      column-gap: clamp(2.5rem, 7vw, 6.5rem);
      row-gap: 1.9rem;
      width: min(100% - var(--gutter) * 2, 65rem);
      margin-inline: auto;
      padding-block: clamp(3rem, 8vw, 6.5rem);
    }

    .intro { grid-area: intro; }
    h1 {
      max-width: 12ch;
      margin: 0;
      font: 500 clamp(3.2rem, 6.5vw, 5rem)/.99 var(--serif);
      letter-spacing: -.015em;
      text-wrap: balance;
    }
    .intro p { margin: 1.1rem 0 0; color: var(--muted); }

    .links { grid-area: links; align-self: center; }
    .links ul { margin: 0; padding: 0; list-style: none; }
    .links li + li { border-bottom: 1px solid var(--line); }
    .link {
      display: flex;
      align-items: center;
      min-height: 3.75rem;
      padding: .7rem 1rem;
      font-weight: 500;
      text-decoration: none;
    }
    .link:hover { color: var(--accent-hover); background: var(--surface); }
    .link.primary {
      justify-content: center;
      min-height: 3.5rem;
      margin-bottom: .9rem;
      border-radius: 4px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }
    .link.primary:hover { background: var(--accent-hover); }

    .photos { grid-area: photos; display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; margin: 0; }
    .photos img {
      display: block;
      width: 100%;
      height: clamp(8rem, 18vw, 12.5rem);
      object-fit: cover;
      background: #e9e1d4;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "intro" "links" "photos";
        row-gap: 1.6rem;
      }
      .link { padding-inline: .75rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="wordmark">Merchendice</span>
    </div>
  </header>

  <main>
    <div class="intro">
      <h1>Merchendice links</h1>
      <p>A merch studio for creators and influencers.</p>
    </div>

    <nav class="links" aria-label="Merchendice links">
      <ul>
        <li><a class="link primary" href="https://merchendice.com">Visit Merchendice</a></li>
        <li><a class="link" href="https://www.tiktok.com/@merchendices">TikTok</a></li>
        <li><a class="link" href="https://www.instagram.com/merchendicebrand/">Instagram</a></li>
        <li><a class="link" href="https://www.youtube.com/@Merchendice">YouTube</a></li>
      </ul>
    </nav>

    <div class="photos" aria-hidden="true">
      <img src="https://merchendice.com/images/photo-tote-360.webp" alt="" width="360" height="450">
      <img src="https://merchendice.com/images/hero-tee.webp" alt="" width="720" height="900">
    </div>
  </main>
</body>
</html>
