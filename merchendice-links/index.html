<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visit Merchendice and find us on TikTok, Instagram, and YouTube.">
  <meta name="theme-color" content="#f8f3eb">
  <title>Merchendice Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f3eb;
      --surface: #fdf9f3;
      --ink: #2b2a28;
      --muted: #5e5c58;
      --line: #c9bcad;
      --accent: #b03a26;
      --accent-hover: #8c2e20;
      --on-accent: #fff8f2;
      --serif: "Cormorant Garamond", Garamond, Georgia, serif;
      --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      border-top: .35rem solid var(--accent);
      background: radial-gradient(ellipse at top, #eee1d1, transparent 24rem) no-repeat, var(--paper);
      color: var(--ink);
      font: 1rem/1.55 var(--sans);
    }
    main {
      width: min(100% - 2rem, 34rem);
      margin-inline: auto;
      padding-block: clamp(2.25rem, 6vw, 4.25rem) 3rem;
    }
    .side-banner { display: none; }

    @media (min-width: 48rem) {
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 2.6fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(1.25rem, 3vw, 3.25rem);
        width: min(100% - 3rem, 76rem);
        margin-inline: auto;
      }
      main { width: min(100%, 34rem); }
      .side-banner {
        display: block;
        width: min(100%, 14.5rem);
        aspect-ratio: 3 / 4;
        border: clamp(.3rem, .65vw, .55rem) solid var(--surface);
        outline: 1px solid var(--line);
        background-color: #e9e1d4;
        background-position: center;
        background-size: cover;
        box-shadow: 0 .9rem 1.8rem rgb(60 40 25 / 14%);
        animation: banner-in .85s ease-out both;
      }
      .side-banner-left {
        justify-self: end;
        margin-block-end: 4.5rem;
        rotate: -4deg;
        background-image: url("https://merchendice.com/images/photo-tote-720.webp");
        animation-delay: .12s;
      }
      .side-banner-right {
        justify-self: start;
        margin-block-start: 4.5rem;
        rotate: 4deg;
        background-image: url("https://merchendice.com/images/hero-tee.webp");
        animation-delay: .28s;
      }
    }
    @keyframes banner-in {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile { margin-bottom: 2rem; text-align: center; }
    .profile-photo {
      display: block;
      width: 6.5rem;
      height: 6.5rem;
      margin: 0 auto .95rem;
      border: 3px solid var(--paper);
      border-radius: 50%;
      outline: 1px solid var(--accent);
      background: #d4cbbe;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font: 600 clamp(3rem, 10vw, 4.25rem)/1 var(--serif);
      letter-spacing: -.035em;
    }
    .profile p { margin: .45rem 0 0; color: var(--muted); }

    ul { display: grid; gap: .7rem; margin: 0; padding: 0; list-style: none; }
    .link {
      display: flex;
      align-items: center;
      gap: .95rem;
      min-height: 4.4rem;
      padding: .65rem .85rem;
      border: 1px solid var(--line);
      border-radius: .35rem;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: background-color .18s ease, border-color .18s ease;
    }
    .link:hover { border-color: var(--accent); background: #f3e8da; }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .link.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
    .link.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .link-name { display: block; font-weight: 600; }
    .link-detail { display: block; color: var(--muted); font-size: .875rem; }
    .primary .link-detail { color: inherit; }

    .icon {
      position: relative;
      display: grid;
      flex: 0 0 2.5rem;
      height: 2.5rem;
      place-items: center;
      border-radius: .2rem;
      background: #eee3d7;
      color: var(--accent-hover);
    }
    .primary .icon { background: var(--on-accent); font: 600 1.65rem/1 var(--serif); }
    .icon svg { width: 1.15rem; height: 1.15rem; fill: currentColor; }
    .camera::before {
      content: "";
      width: 1.05rem;
      height: 1.05rem;
      border: 2px solid currentColor;
      border-radius: .32rem;
    }
    .camera::after {
      position: absolute;
      content: "";
      width: .35rem;
      height: .35rem;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      box-shadow: .34rem -.34rem 0 -.19rem currentColor;
    }
    .video::before { content: ""; width: 1.22rem; height: .85rem; border-radius: .24rem; background: currentColor; }
    .video::after {
      position: absolute;
      content: "";
      margin-left: .12rem;
      border-block: .19rem solid transparent;
      border-left: .32rem solid #eee3d7;
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .side-banner { animation: none; }
    }
  </style>
</head>
