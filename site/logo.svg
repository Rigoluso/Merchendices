<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MERX split-signal dice mark</title>
  <desc id="desc">A rounded die split diagonally between monochrome television scanlines and four vivid color bands.</desc>
  <defs>
    <clipPath id="die-clip"><rect x="4" y="4" width="56" height="56" rx="14"/></clipPath>
    <pattern id="scanline-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#efefef"/>
      <rect y="2" width="4" height="2" fill="#b8b8b8"/>
    </pattern>
  </defs>
  <g clip-path="url(#die-clip)">
    <rect x="4" y="4" width="56" height="56" fill="#080808"/>
    <path d="M4 4H60L4 60Z" fill="url(#scanline-pattern)"/>
    <path d="M60 4V60H4Z" fill="#a4ff00"/>
    <path d="M60 4V25L25 60H4Z" fill="#8468ff" opacity=".92"/>
    <path d="M60 24V43L43 60H24Z" fill="#ff6b2c" opacity=".96"/>
    <path d="M60 43V60H43Z" fill="#48e7ff"/>
    <path d="M5 22h25v3H5zm0 9h16v2H5zm7 9h12v3H9z" fill="#fff" opacity=".7"/>
    <circle cx="16" cy="16" r="4" fill="#050505"/>
    <circle cx="30" cy="30" r="4" fill="#050505"/>
    <circle cx="48" cy="48" r="4" fill="#050505"/>
    <path d="M4 60 60 4" stroke="#050505" stroke-width="2.5"/>
    <rect x="23" y="24" width="20" height="16" rx="5" fill="#050505"/>
    <text x="33" y="35.5" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="-1">MX</text>
  </g>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#f7f7f2" stroke-width="2"/>
</svg>
