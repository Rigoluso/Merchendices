<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MERX split-signal die</title>
  <desc id="desc">An isometric die split between monochrome television scanlines and vivid color facets, with a subtle M and X formed by its seams.</desc>
  <defs>
    <pattern id="scanline-pattern" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#f7f7f2"/>
      <rect y="1" width="3" height="1" fill="#9b9b98"/>
      <rect y="2" width="3" height="1" fill="#303030"/>
    </pattern>
    <filter id="die-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <g filter="url(#die-shadow)" stroke="#050505" stroke-linejoin="round" stroke-width="1.5">
    <g id="crt-face">
      <path d="M32 5 57 19 32 34 7 19Z" fill="url(#scanline-pattern)"/>
      <path d="M7 19 32 34 32 59 7 44Z" fill="url(#scanline-pattern)"/>
      <path d="M9 23 30 35V39L9 27ZM9 32 30 44V47L9 35ZM9 41 27 51V54L9 44Z" fill="#f7f7f2" stroke="none" opacity=".34"/>
    </g>

    <g id="spectrum-face">
      <path d="M32 34 57 19 57 44 32 59Z" fill="#a4ff00"/>
      <path d="M32 34 57 19 57 31 44 39Z" fill="#a4ff00" stroke="none"/>
      <path d="M44 39 57 31 57 44 49 49Z" fill="#8468ff" stroke="none"/>
      <path d="M32 34 44 39 49 49 32 59Z" fill="#48e7ff" stroke="none"/>
      <path d="M7 44 32 59 32 45 19 37Z" fill="#ff6b2c" stroke="none"/>
      <path d="M19 37 32 45 32 34 25 30Z" fill="#8468ff" stroke="none" opacity=".92"/>
    </g>

    <g fill="#050505" stroke="none">
      <ellipse cx="20" cy="18" rx="3.2" ry="2.1" transform="rotate(28 20 18)"/>
      <ellipse cx="41" cy="18" rx="3.2" ry="2.1" transform="rotate(-28 41 18)"/>
      <ellipse cx="15" cy="31" rx="2.6" ry="3.7" transform="rotate(-29 15 31)"/>
      <ellipse cx="25" cy="47" rx="2.6" ry="3.7" transform="rotate(-29 25 47)"/>
      <ellipse cx="48" cy="31" rx="2.6" ry="3.7" transform="rotate(29 48 31)"/>
      <ellipse cx="42" cy="47" rx="2.6" ry="3.7" transform="rotate(29 42 47)"/>
      <ellipse cx="52" cy="42" rx="2.6" ry="3.7" transform="rotate(29 52 42)"/>
    </g>

    <g id="mx-negative-space" fill="none" stroke="#050505" stroke-linecap="square" opacity=".48">
      <path d="M12.5 26V38.5L18.5 42V34.5L25 38.5V49"/>
      <path d="M36.5 34.5 52.5 44M52.5 27.5 36.5 52"/>
    </g>

    <path d="M32 5 57 19 57 44 32 59 7 44V19Z" fill="none" stroke="#f7f7f2" stroke-width="1.2"/>
    <path d="M7 19 32 34 57 19M32 34V59" fill="none" stroke="#050505"/>
  </g>
</svg>
